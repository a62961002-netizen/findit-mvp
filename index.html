<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FindIt - Find Where It's Available</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">
        <div class="logo">Find<span>It</span></div>
        <div class="tagline">Find where it's available.</div>
    </header>

    <main>

        <section class="hero">

            <h1>Where can I get it?</h1>

            <p>
                Search a game and find where it's officially available.
            </p>

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search GTA 5, Minecraft..."
                    autocomplete="off"
                >

                <button id="searchButton">
                    Search
                </button>

            </div>

            <div class="examples">
                Try:
                <button onclick="quickSearch('GTA 5')">GTA 5</button>
                <button onclick="quickSearch('Minecraft')">Minecraft</button>
                <button onclick="quickSearch('Cyberpunk 2077')">
                    Cyberpunk 2077
                </button>
            </div>

        </section>


        <section id="results" class="results">

            <div class="empty-state">

                <div class="empty-icon">🔎</div>

                <h2>Search for a game</h2>

                <p>
                    We'll show its platform and official store.
                </p>

            </div>

        </section>

    </main>


    <footer>

        <p>
            FindIt helps users discover official sources.
        </p>

        <p>
            © 2026 FindIt
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
